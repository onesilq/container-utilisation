<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Container Utilisation Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600&display=swap">
<style>
:root{
  /* Layout: Silq's own shell. Pastel ground, white rounded canvas, "Jump back in" bar underneath. Side nav, top bar and bottom bar copied from the Pods prototype; page content measured from the 1440px reference screenshots. Single light theme, matching the product. */
  color-scheme:light;
  --shell:#F8F4EE;
  --av:#E4E8F1; --av-ink:#2B3A5C;
  --astra-1:#2FAB83; --astra-2:#334BFA;
  --canvas:#FFFFFF;
  --ink:#1A1A1A;
  --ink-2:#404040;
  --ink-3:#666666;
  --ink-4:#8A8A8A;
  --line:#EBEBEB;
  --line-2:#D6D6D6;
  --line-3:#B1B1B1;
  --soft:#F2F2F2;
  --soft-2:#F8F8F8;
  --navy:#384A66;
  --brand:#308268;
  --brand-hover:#276C56;
  --blue:#2F3BA6;
  --blue-soft:#E7ECFF;
  --blue-line:#4350A8;
  --astra:#293CC8;
  --lav:#ECEDFF;
  --lav-badge:#E9ECFB;
  --violet:#7D63FF;
  --ok:#2E9348;
  --leaf:#299446; /* the carbon unit's leaf (designer's Figma 251:42190, 16 Nov); not the brand green, which stays for primary buttons */
  --ok-ink:#21693A;
  --ok-soft:#E7F4EC;
  --danger:#DC3C45;
  --danger-ink:#A8262F;
  --amber:#E2A43E;
  --cream:#FDF8EA;
  --route:#394251;
  --g1:#57A188;
  --g2:#4351B0;
  --tip:#1E1E1E;
  --shadow-pop:0 12px 32px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06);
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ft:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; /* headings on the Shipment details page (Figma Heading/h5) */
  --side-w:208px;
  --sbw:0px;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
/* The page behind the canvas is the Pods prototype's pastel wash (Figma "Pods workspace"): lavender top left, warm sand lower down, mint on the right. */
body{margin:0;background:linear-gradient(90deg,rgba(236,245,243,0) 55%,#ECF5F3 92%) fixed,linear-gradient(180deg,#F3EFF6 0%,#F7F3EF 45%,#F9F4ED 70%) fixed,var(--shell);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ===== shell: side nav and top bar copied from the Pods prototype (Figma "Pods workspace") ===== */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);height:100%}
.app.collapsed{--side-w:76px}
.side{display:flex;flex-direction:column;padding:20px 16px;overflow-y:auto;scrollbar-width:none;min-height:0}
.side::-webkit-scrollbar{display:none}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px;height:24px;margin-bottom:24px}
.logo{width:24px;height:24px;display:block;border-radius:5px}
.side-tg{border:0;background:none;padding:0;width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:#202020;flex:none}
.side-tg:hover{background:rgba(0,0,0,.045)}
.side-tg svg{width:20px;height:20px}
.nav{display:grid;gap:0}
.nav-g{display:grid;gap:4px;margin-top:12px}
.nav-g.first{margin-top:0;gap:8px}
.nav-g.first + .nav-g{margin-top:32px}
.nav-i{display:flex;align-items:center;gap:4px;height:30px;padding:0 3px;border-radius:5px;border:1px solid transparent;background:none;text-align:left;font-size:14px;line-height:16px;letter-spacing:-.003em;color:#202020;width:100%;white-space:nowrap}
.nav-g:not(.first) > .nav-i:not(.nav-sub){margin-bottom:-1px}
.nav-i svg{flex:none;width:24px;height:24px}
.nav-i:hover{background:rgba(0,0,0,.045)}
.nav-sub{margin-left:22px;width:calc(100% - 22px);padding:0 9px}
.nav-i[aria-current="page"]{background:var(--canvas);border-color:#042868;box-shadow:2px 2px 0 rgba(0,0,0,.15),1px 1px 1px rgba(0,0,0,.08);font-weight:500;color:#111}
.side-foot{margin-top:auto;padding-top:10px;font-size:10px;line-height:16px;font-weight:600;letter-spacing:0;text-transform:uppercase;color:#909090;display:flex;align-items:center;gap:4px}
.side-foot .silq{display:inline-flex}
.app.collapsed .nav-l,.app.collapsed .nav-sub,.app.collapsed .logo,.app.collapsed .side-foot{display:none}
.app.collapsed .side{padding-inline:12px}
.app.collapsed .nav-i{justify-content:center;padding-inline:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:11px 12px 0 0}
.canvas{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--canvas);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 1px rgba(0,0,0,.08)}
.topbar{flex:none;display:flex;align-items:center;gap:8px 14px;padding:12px 20px 11px;border-bottom:1px solid #EBEBEB;min-height:56px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:6px;font-size:16px;line-height:16px;font-weight:600;letter-spacing:-.003em;color:#202020;min-width:0;flex-wrap:wrap}
.crumbs .sep{display:inline-flex;color:#202020}
.crumb-l{border:0;background:none;padding:0;font-size:inherit;font-weight:inherit;line-height:inherit;color:#202020}
.crumb-l:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* Ask Astra: a white pill with a green-to-blue edge, overlapping the grey history half */
.astra-wrap{display:inline-flex;align-items:center;isolation:isolate}
.astra{position:relative;z-index:1;display:inline-flex;align-items:center;gap:4px;height:35px;padding:0 8px;border-radius:999px;border:1.5px solid transparent;background:linear-gradient(var(--canvas),var(--canvas)) padding-box,linear-gradient(90deg,var(--astra-1),var(--astra-2)) border-box;box-shadow:0 4px 4px rgba(51,83,241,.08);margin:-1.5px 0;color:var(--astra);font-weight:600;font-size:13px;line-height:16px;letter-spacing:-.003em}
.astra svg{color:var(--astra);width:16px;height:16px}
.astra-h{margin-left:-16px;height:32px;padding:0 10px 0 24px;border:0;border-radius:0 999px 999px 0;background:#EBEBEB;display:grid;place-items:center;color:#6C6C6C}
.astra-h svg{width:20px;height:20px}
.astra-h:hover{color:var(--ink)}
.btn-rfq{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 11px;border-radius:5px;border:1px solid var(--brand);background:var(--brand);color:#FFFFFF;font-weight:600;font-size:14px;line-height:16px;letter-spacing:-.003em;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:nowrap}
.btn-rfq:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn-rfq svg{width:20px;height:20px}
.icon-btn{border:0;background:none;width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--ink);flex:none;padding:0}
.icon-btn:hover{background:var(--soft)}
.topbar .icon-btn{width:32px;height:32px;border-radius:5px;color:#202020}
.topbar .icon-btn svg{width:20px;height:20px}
.me{width:32px;height:32px;border-radius:50%;background:var(--av);color:var(--av-ink);display:grid;place-items:center;font-weight:600;font-size:12px;border:0;padding:0}
.menu-btn{display:none}
.scrim{position:fixed;inset:0;background:rgba(20,20,20,.38);z-index:45}
.body{flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable}
/* bottom bar: Jump back in, as in the Pods prototype (was "Most visited") */
.bottombar{flex:none;display:flex;align-items:center;gap:14px;min-height:36px;padding:0 0 0 8px}
.jump{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;min-width:0;overflow:hidden}
.jump > span{font-weight:500;color:#202020;white-space:nowrap}
.jump-i{display:inline-flex;gap:4px;align-items:center;white-space:nowrap;border:0;background:none;padding:0;font-size:12px;color:#464646;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.jb{width:18px;height:18px;border-radius:3px;font-size:10px;line-height:16px;font-weight:600;display:inline-grid;place-items:center;flex:none;border:1px solid}
.jb.p{color:#10467F;background:#E6F3FE;border-color:#9CCFFD}
.jb.s{color:#8B450C;background:#FDEDE0;border-color:#F9B474}
.jump-more{display:inline-flex;align-items:center;height:18px;font-size:12px;line-height:16px;font-weight:700;color:#202020;border:1px solid #B1B1B1;border-radius:3px;padding:0 4px;background:var(--canvas);box-shadow:0 1px 1px rgba(0,0,0,.08);flex:none}
.jump-set{display:inline-grid;place-items:center;width:18px;height:18px;border:0;background:none;padding:0;color:#202020;flex:none}
/* Prototype bar, as in the Pods prototype: picks the Insights chart's view. Shown on the Insights page only */
.proto-ctl{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--ink);color:#FFFFFF;border-radius:999px;padding:2px 2px 2px 13px;flex:none}
.proto-ctl[hidden]{display:none}
.proto-l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.7}
.proto-b{border:0;background:rgba(255,255,255,.12);color:#FFFFFF;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500;line-height:18px;white-space:nowrap}
.proto-b:hover{background:rgba(255,255,255,.22)}
.proto-b[aria-pressed="true"]{background:#FFFFFF;color:#1E1E1E}
@media (max-width:440px){.proto-l{display:none}.proto-ctl{padding-left:2px}}
/* under 900px, as in Pods: Jump back in hides and the Prototype bar takes the full row; with no Prototype bar (every page but Insights) the bottom bar hides */
@media (max-width:900px){.jump{display:none}.bottombar{padding:8px 16px}.bottombar:not(:has(.proto-ctl:not([hidden]))){display:none}.proto-ctl{margin-left:0;width:100%;justify-content:space-between}}

/* ===== shared ===== */
.sq-btn{width:34.5px;height:34.5px;border:1px solid var(--line-2);border-radius:6px;background:var(--canvas);display:inline-grid;place-items:center;padding:0;color:var(--ink);flex:none}
.sq-btn:hover{border-color:var(--ink-4)}
.link-u{border:0;background:none;padding:0;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.copy{border:0;background:none;padding:0;display:inline-grid;place-items:center;color:var(--ink)}
.flag{display:inline-block;width:16px;height:11px;border-radius:2px;flex:none;vertical-align:-1px}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--tip);color:#FFFFFF;padding:10px 14px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow-pop);z-index:95;max-width:min(520px,calc(100vw - 32px))}
.pop{position:fixed;z-index:60;background:var(--canvas);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-pop);padding:5px;min-width:200px}
.pop-i{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;border:0;background:none;padding:8px 10px;border-radius:6px;text-align:left;font-size:14px}
.pop-i:hover,.pop-i[aria-current="true"]{background:var(--soft)}
.pop-i small{color:var(--ink-3);font-size:12.5px}

/* ===== project ===== */
.pg{padding:27px calc(35px - var(--sbw)) 48px 35px}
.pj-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-top:8px}
.pj-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:13px;color:#414141}
.pj-av{width:20px;height:20px;border-radius:50%;display:block;margin-right:1.5px}
.id-chip{display:inline-flex;align-items:center;height:21.5px;padding:0 8.5px;font-size:13px;margin-right:2px;border-radius:5px;background:var(--cream);color:#211911}
.pj-meta .dot{margin:0 3px 0 0}
.po-chip{display:inline-flex;align-items:center;height:22.3px;padding:0 6.5px;font-size:12.75px;border-radius:999px;background:#F0F0F0;border:1px solid #E2E2E2;color:var(--ink)}
.ed-chip{display:inline-flex;align-items:center;gap:5px;height:22.3px;padding:0 10px;border-radius:999px;background:var(--blue-soft);border:1px solid var(--blue-line);color:var(--blue);font-size:13.5px}
.pj-title{font-size:26px;font-weight:700;letter-spacing:-.016em;line-height:1.25;margin-top:12px;color:#0E0E0E}
.mailrow{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:15px;color:var(--ink-2)}
.mailrow .copy{color:var(--blue);margin-left:5px}
.stages{display:flex;align-items:center;margin-top:38.5px}
.st{display:flex;gap:10px;flex:none}
.st-ic{width:18px;height:18px;flex:none;margin-top:3px}
.st b{display:block;font-size:15px;font-weight:600;line-height:22px}
.st span{display:block;font-size:13px;color:#414141;line-height:20px}
.st-ln{flex:1;height:2px;background:#D6D6D6;margin:4px 18px 0;position:relative;min-width:24px}
.st-ln i{position:absolute;inset:0 auto 0 0;background:#1E1E1E}
.tabs-u{display:flex;margin-top:40.5px;border-bottom:1px solid #E0E0E0;overflow-x:auto;scrollbar-width:none}
.tab-u{border:0;background:none;padding:12px 17.5px 9.5px;font-size:14.5px;font-weight:500;color:#686868;white-space:nowrap;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab-u[aria-selected="true"]{color:var(--ink);font-weight:500;border-bottom-color:#212121}
.tab-u:hover{color:var(--ink)}
.shp-list{display:grid;gap:14.5px;margin-top:23.5px}
.shp{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--canvas);cursor:pointer;transition:box-shadow .15s}
.shp:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
.shp-h{display:flex;align-items:center;gap:12px;height:41px;padding:0 18px 2px;background:var(--soft-2);font-size:13px;white-space:nowrap}
.shp-h .nm{font-weight:600;display:inline-flex;align-items:center;gap:7px;min-width:0}
.shp-h .nm span{overflow:hidden;text-overflow:ellipsis}
.shp-h .crd{font-weight:600}
.shp-h .ves{display:inline-flex;align-items:center;gap:5px;color:#414141;margin-left:-2px}
.shp-h .ves::before{content:"";width:4px;height:4px;border-radius:50%;background:#1E1E1E;margin-right:8px}
.shp-h .shr{display:inline-grid;place-items:center;border:0;background:none;padding:0;margin-left:4px;color:var(--ink)}
.shp-h .upd{margin-left:auto;color:#686868;font-size:12.75px}
.shp-b{display:grid;grid-template-columns:253px minmax(0,1fr);padding:18px 18px 13px}
.shp-id{font-size:14.75px;font-weight:500;line-height:20px}
.shp-ct{display:grid;grid-template-columns:61px 160px;margin-top:9px}
.shp-ct svg{margin:6px 0 0 4px}
.shp-ct b{font-weight:600}
.shp-ct .eq{font-size:14px;color:var(--ink-3);line-height:20px}
.shp-ct .cn{font-size:13.5px;color:#3F3F3F;line-height:19px;margin-top:1px;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rt{position:relative;height:86px}
.rt-d,.rt-l{position:absolute;white-space:nowrap}
.rt-d{top:0;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);line-height:20px}
.rt-d svg{color:var(--ink)}
.rt-l{top:53.7px;font-size:13px;line-height:19.5px}
.rt-l b{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.rt-l span{display:block;color:var(--ink-3)}
.rt-x0{left:0}.rt-xm{transform:translateX(-50%);text-align:center}.rt-x1{right:0;text-align:right}
.rt-xm b,.rt-x1 b{justify-content:center}
.rt-x1 b{justify-content:flex-end}
.rt-n{position:absolute;top:31px;width:12px;height:12px;border-radius:3px;background:#111111;transform:translateX(-50%)}
.rt-n.first{transform:none}.rt-n.last{transform:translateX(-100%)}
.rt-leg{position:absolute;top:36px;height:2px;display:flex;align-items:center;gap:7px}
.rt-leg i{flex:1;height:2px;background:var(--route)}
.rt-leg svg{flex:none;margin-top:-4px}

/* ===== shipment details ===== */
/* From the designer's Figma section (node 176:4769, 15 Nov), except the Overview card. Figma's type: UI 12/13/14/16px at 16px line height
   with -0.3% tracking, body 13/20, Inter Tight 20/28 for headings. Greys: #202020 text, #464646 labels, #6C6C6C secondary, #909090 muted,
   #B1B1B1 and #EBEBEB lines. Figma uses SF Pro Text in a few spots (AI summary body, PO chips, names); the prototype keeps Inter there. */
#v-shipment{padding:24px calc(24px - var(--sbw)) 48px 24px}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.sh-t{display:flex;align-items:center;gap:4px;font-family:var(--ft);font-size:20px;font-weight:600;line-height:28px;color:#202020}
.sh-t .lk{border:0;background:none;padding:0;font:inherit;color:inherit}
.sh-t .lk:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.sh-t .sep{display:inline-flex}
.dd{width:26px;height:26px;border:1px solid #D5D5D5;border-radius:5px;background:var(--canvas);display:inline-grid;place-items:center;padding:0;margin-left:4px;color:#202020}
.sh-sub{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:13px;line-height:16px;letter-spacing:-.003em;color:#6C6C6C}
.sh-sub .cl{display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px 6px;min-width:0}
.sh-sub .cl b{font-weight:500;color:#202020}
.sh-sub .cl img{width:16px;height:16px;border-radius:50%;object-fit:cover;flex:none}
.sh-sub .sh-rt{display:inline-flex;align-items:center;gap:6px;min-width:0}
.sh-sub .em{display:inline-flex;align-items:center;gap:4px}
.sh-sub .em svg{flex:none}
.sh-sub .copy{margin-left:-2px;color:#202020}
.sh-acts{display:flex;gap:9px}
.sh-grid{display:grid;grid-template-columns:minmax(0,1fr) 449px;gap:0 32px;align-items:start;margin-top:24px}
/* AI summary: a 1.5px teal-to-blue border and a faint lavender wash at the top */
.ai{display:grid;gap:6px;border:1.5px solid transparent;border-radius:8px;background:linear-gradient(to top,#FFFFFF 50.7%,#F4F5FF) padding-box,linear-gradient(to bottom right,#30AC84,#334BFA) border-box;padding:14.5px}
.ai-h{display:flex;align-items:center;gap:6px}
.ai-h svg{flex:none}
.ai h3{margin:0;font-size:14px;font-weight:600;line-height:16px;letter-spacing:-.003em;color:#202020}
.ai p{font-size:13px;line-height:20px;letter-spacing:-.003em;color:#464646}
.ai p b{font-weight:600}
.ai-lk{justify-self:start;border:0;background:none;padding:0;font-size:12px;font-weight:600;line-height:16px;color:#293CC8}
.ai-lk:hover{text-decoration:underline;text-underline-offset:3px}
.tabs-b{display:flex;gap:16px;margin-top:24px;overflow-x:auto;scrollbar-width:none}
.tab-b{border:0;background:none;padding:0;font-size:16px;font-weight:600;line-height:16px;letter-spacing:-.003em;color:#909090;white-space:nowrap}
.tab-b[aria-selected="true"],.tab-b:hover{color:#202020}
.sec-l{font-size:14px;font-weight:600;line-height:16px;letter-spacing:-.003em;color:#202020}
.po{margin-top:24px}
.po-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.po-tag,.po-ed{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 4px;border-radius:5px;font-size:10px;font-weight:600;line-height:16px;text-transform:uppercase}
.po-tag{background:#F1F1F1;border:1px solid #B1B1B1;color:#202020}
.po-ed{background:#EBEDFF;border:1px dashed #334BFA;color:#293CC8}
.po-ed:hover{background:#E0E4FF}
/* Details: label 160px wide, value beside it, a hairline between rows; no line under the last row of either column */
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px;margin:24px 0 0}
.fact{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #EBEBEB;font-size:14px;line-height:16px;letter-spacing:-.003em}
.fact:nth-child(-n+2){padding-top:0}
.fact dt{color:#464646}
.fact dd{margin:0;font-weight:600;color:#202020}
.fact.last{border-bottom:0;padding-bottom:0}
.soon{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;background:#F2F2F2;font-size:12px;line-height:1.5;color:#909090;margin-top:20px}
.soon svg{flex:none}
/* Activities */
.cmt-h{font-size:16px;font-weight:600;line-height:16px;letter-spacing:-.003em;color:#202020;margin-top:24px}
.cmt-in{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #B1B1B1;border-radius:8px;background:var(--canvas);box-shadow:0 1px 1px rgba(0,0,0,.08);margin-top:12px}
.av-s{width:20px;height:20px;border-radius:50%;background:var(--violet);color:#FFFFFF;display:grid;place-items:center;font-size:9px;font-weight:600;flex:none}
.cmt-in input{flex:1;min-width:0;border:0;outline:0;padding:0;font-size:14px;line-height:1.5;letter-spacing:-.002em;color:#202020;background:none}
.cmt-in input::placeholder{color:#909090}
.more{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:5px;background:#F2F2F2;margin-top:16px;font-size:12px;line-height:16px;color:#202020;width:100%;border:0;text-align:left}
.more b{font-weight:600}
.more svg{flex:none}
.pills{display:flex;gap:4px;margin-top:16px;flex-wrap:wrap}
.pill{height:28px;padding:0 16px;border-radius:999px;border:0;background:var(--canvas);font-size:13px;font-weight:500;line-height:16px;letter-spacing:-.003em;color:#6C6C6C}
.pill[aria-pressed="true"]{background:#202020;color:#FFFFFF}
.pill:hover:not([aria-pressed="true"]){background:#F2F2F2}
.empty{text-align:center;color:#909090;font-size:14px;line-height:20px;padding:48px 0 32px}
/* Overview card (designer's Figma 251:42190, 16 Nov): a lavender frame (Background/Accent light) with the header row on it, and the facts and photos
   on a white card inside it. Inter Tight 600 16/24 for the title and the values, Inter 13/16 for labels, 14/16 semibold for the two header units. */
.ov{background:#EBEDFF;border-radius:12px;padding:8px 4px 4px} /* 4px of lavender round the white card; the Figma frame is a fixed 301px, so its white card reaches the bottom edge */
.ov-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px;padding:2px 12px;margin-bottom:8px;white-space:nowrap}
.ov-h h2{font-family:var(--ft);font-size:16px;font-weight:600;line-height:24px;letter-spacing:-.032px;color:#111111}
.ov-tags{display:flex;align-items:center;gap:8px}
/* FCL, a container filling with cargo, and the percentage: one button. Plain at rest, a shape on hover; it opens the utilisation popover */
.ut-u{position:relative;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px;border:0;border-radius:6px;background:none;font-size:14px;font-weight:600;line-height:16px;letter-spacing:-.042px;color:#111111;font-variant-numeric:tabular-nums;transition:background .12s}
.ut-u:hover,.ut-u:focus-visible{background:rgba(10,11,18,.06)}
.ut-u .none{font-weight:400;color:var(--ink-4)}
.ut-u .glyph{display:block;flex:none}
.ut-tip{position:absolute;top:calc(100% + 8px);right:0;z-index:20;display:none;background:var(--tip);color:#FFFFFF;border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:400;line-height:1.5;letter-spacing:0;text-align:left;white-space:nowrap;box-shadow:var(--shadow-pop)}
.ut-u:hover .ut-tip,.ut-u:focus-visible .ut-tip{display:block}
.chip{display:inline-flex;align-items:center;height:21px;padding:0 6px;border-radius:4px;background:var(--lav-badge);color:#2E3AA3;font-size:12.5px;font-weight:600;white-space:nowrap}
.ov-in{padding:16px;background:#FFFFFF;border-radius:12px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.ov-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
/* Each fact: a 16px line icon beside the value (the container's is 18px), the label 2px under it */
.kv{min-width:0}
.kv b{display:flex;align-items:center;gap:6px;font-family:var(--ft);font-size:16px;font-weight:600;line-height:24px;letter-spacing:-.032px;color:#202020;overflow-wrap:anywhere}
.kv b svg{display:block;flex:none}
.kv span{display:block;margin-top:2px;font-size:13px;line-height:16px;letter-spacing:-.039px;color:#6C6C6C}
.kv span .link-u{font-weight:500;color:#202020}
.plus{display:inline-grid;place-items:center;height:22px;min-width:22px;padding:0 5px;border-radius:5px;background:#EBEDFF;color:#293CC8;font-family:var(--f);font-size:13px;font-weight:500;letter-spacing:0}
.ov-ci{margin-top:12px;padding-top:8px;border-top:1px solid #D5D5D5;font-size:13px;line-height:16px;letter-spacing:-.039px;color:#202020}
/* Photos: four equal tiles 80px tall with 5px corners, at most 87px wide as in the Figma; a slow zoom on hover. A red flag with a sparkle on the ones
   the design flags; the last tile is "+5" in Accent/70 on the lavender. */
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:372px;margin-top:8px}
.thumbs button{position:relative;height:80px;border:0;padding:0;border-radius:5px;overflow:hidden;background:#EEEEEE}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.thumbs button:hover img{transform:scale(1.05)}
.th-ai{position:absolute;top:6px;right:6px;display:flex;padding:2px;border-radius:999px;background:#CF222E}
.th-ai svg{display:block}
.thumbs .th-more{display:grid;place-items:center;background:#EBEDFF;color:#293CC8;font-size:14px;font-weight:500;line-height:16px;letter-spacing:-.042px;transition:background .12s}
.thumbs .th-more:hover{background:#DFE2FF}
@media (prefers-reduced-motion:reduce){ .thumbs img{transition:none} .thumbs button:hover img{transform:none} }
/* Phones: one fact per row, so container numbers never break */
@media (max-width:420px){ .ov-grid{grid-template-columns:minmax(0,1fr);gap:12px} }
/* Under 30% space used, the popover's message opens the card: a still drawing of the container above it, hidden per shipment once dismissed */
/* Overview note, Figma 252:56546 (designer, 16 Nov, v85): an amber alert, 16px in from the outer edge (15px padding inside the 1px border, as the Figma draws its border inside), 8px corners. The container drawing (97 × 44) on top,
   the title 2px under it and the sentence 8px under that, all #202020; the sentence has no bold here. Close button 7px in from the top right. */
.ov-nt{position:relative;margin-bottom:16px;padding:15px;border:1px solid #F49D1A;border-radius:8px;background:#FEF5E8;box-shadow:inset 0 1px 0 rgba(255,255,255,.2);display:flex;flex-direction:column;gap:2px}
.ov-nt-art{display:flex}
.ov-nt-tx{display:flex;flex-direction:column;gap:8px}
.ov-nt h3{margin:0;font-size:14px;font-weight:500;line-height:16px;letter-spacing:-.042px;color:#202020}
.ov-nt p{margin:0;font-size:12px;line-height:18px;color:#202020}
.ov-nt p b{font-weight:inherit;color:inherit}
.ov-nt-x{position:absolute;top:7px;right:7px;width:28px;height:28px;border:0;border-radius:5px;background:none;display:grid;place-items:center;color:#6C6C6C;padding:0}
.ov-nt-x:hover{background:rgba(10,11,18,.06);color:#202020}
/* Under the Overview card (Figma's Timeline block): delivery date, map, where it is, timeline */
.dl{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-top:24px}
.dl small{display:block;font-size:12px;font-weight:700;line-height:16px;text-transform:uppercase;color:#909090}
.dl strong{display:block;font-family:var(--ft);font-size:20px;font-weight:600;line-height:28px;color:#202020;margin-top:2px}
.done{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 6px;border:0;border-radius:999px;background:#EAF6ED;color:#1E7339;font-size:12px;font-weight:700;line-height:16px;text-transform:uppercase;flex:none}
.done::before{content:"";width:12px;height:12px;border-radius:50%;background:#2E9348}
.done svg{opacity:.6}
.done:hover{background:#DDF0E2}
.eta{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:#6C6C6C;margin-top:4px}
.eta b{color:var(--danger-ink);font-weight:600}
.map{display:block;width:100%;height:180px;border-radius:8px;margin-top:20px;object-fit:cover;background:#E1E4EC}
.at{display:flex;align-items:center;gap:8px;margin-top:12px}
.at > svg{flex:none;color:#202020}
.at b{display:block;font-size:14px;font-weight:600;line-height:16px;letter-spacing:-.003em;color:#1E1E1E}
.at span{display:block;font-size:12px;color:#5C5C5C;line-height:16px;margin-top:2px}
.at .days{margin:0 0 0 auto;display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:#6C6C6C;text-transform:uppercase;white-space:nowrap}
.at .days span{margin:0;color:inherit}
.at .days strong{color:#202020;font-weight:700}
.tl-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:20px}
.tl-h{margin:0;font-size:14px;font-weight:600;line-height:16px;letter-spacing:-.003em;color:#1E1E1E}
.tl-ed{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid #B1B1B1;border-radius:5px;background:var(--canvas);box-shadow:0 1px 1px rgba(0,0,0,.08);font-size:14px;font-weight:500;line-height:16px;letter-spacing:-.003em;color:#202020}
.tl-ed:hover{border-color:#909090}
.tl{margin-top:20px}
.tl-stop{display:grid;grid-template-columns:20px minmax(0,1fr);gap:0 13.5px;align-items:start}
.tl-ic{width:20px;height:20px;margin-top:18px;border-radius:5px;background:#202020;display:grid;place-items:center;color:#FFFFFF}
.tl-stop.to .tl-ic{margin-top:38px}
.tl-tx{display:grid;gap:4px;min-width:0}
.tl-tx small{font-size:12px;font-weight:700;line-height:16px;text-transform:uppercase;color:#909090}
.tl-tx b{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:14px;font-weight:600;line-height:16px;letter-spacing:-.003em;color:#000000}
.tl-tx b .pt{display:inline-flex;align-items:center;gap:4px}
.tl-tx > span{font-size:12px;line-height:16px;color:#202020}
.tl-leg{position:relative;height:96px}
.tl-leg::before{content:"";position:absolute;left:6px;top:8px;width:8px;height:8px;border-radius:50%;background:#202020}
.tl-leg i{position:absolute;left:9px;width:2px;background:#202020}
.tl-leg .a{top:15.5px;height:24px}
.tl-leg .b{top:56px;height:26px}
.tl-leg .arw{position:absolute;left:4px;top:79px;color:#202020;display:flex}
.tl-leg .tr{position:absolute;left:24px;top:40px;font-size:10px;font-weight:600;line-height:16px;text-transform:uppercase;color:#909090;white-space:nowrap}

/* ===== utilisation details: popover for this shipment, side panel for the project and its options ===== */
.ov{position:relative}
.ut-u[aria-expanded="true"]{background:#FFFFFF} /* pressed, while the popover is open: Figma 240:35226 (State=Active), a white shape on the lavender Overview header */
.ut-u[aria-expanded="true"] .ut-tip{display:none}
/* ===== carbon emissions (option B of carbon-options, 11 Nov): a green leaf and the shipment's estimate left of the FCL unit.
   Hover only (designer, 16 Nov): not a button and no popover; the tooltip just says what the figure is, "Estimated carbon emissions". Focusable so the keyboard can show the tooltip too. ===== */
.co-u{position:relative;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px;border:0;border-radius:6px;background:none;cursor:default;font-size:14px;font-weight:600;line-height:16px;letter-spacing:-.042px;color:#111111;font-variant-numeric:tabular-nums;white-space:nowrap;transition:background .12s}
.co-u svg{flex:none;color:var(--leaf)}
.co-u .u{font-size:13px;font-weight:500;letter-spacing:-.039px;color:#464646}
.co-u .none{font-weight:400;color:var(--ink-4)}
.co-u .sh{display:none}
.co-u:hover .ut-tip,.co-u:focus-visible .ut-tip{display:block}
/* phones: the header has room for "1.6 t" beside the FCL unit; the tooltip gives the rest */
@media (max-width:560px){ .co-u .lg{display:none} .co-u .sh{display:inline} }
#ud:focus{outline:0}
#ud .chip{background:var(--soft);color:var(--ink-2)}
.ud-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ud-h h2{font-size:16.75px;font-weight:700;line-height:24px;color:#0A0B12}
.ud-sub{font-size:13px;line-height:19px;color:var(--ink-3);margin-top:1px}
.ud-x{width:32px;height:32px;margin:-4px -7px 0 0;border:0;border-radius:8px;background:none;display:grid;place-items:center;padding:0;color:var(--ink);flex:none}
.ud-x:hover{background:var(--soft)}
.ud-stage{position:relative;padding:40px 0 20px}
.ud-art{display:flex;justify-content:center}
.c3d{display:block;max-width:100%;height:auto}
.ud-pct{position:absolute;top:0;right:20px;text-align:left}
/* a hidden copy of the final figure keeps the box at its final width while the figure counts up, so the left edge and "Volume used" stay put */
.ud-pct-n{display:grid}
.ud-pct-n>b{grid-area:1/1}
.ud-pct-n .gh{visibility:hidden}
.ud-pct b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:34px;color:#0A0B12;font-variant-numeric:tabular-nums}
.ud-pct span{display:block;font-size:12.5px;line-height:17px;color:var(--ink-3)}
/* the container type, under the drawing on the left (option A of container-type-options, 12 Nov): built like the percentage in the opposite corner, a step smaller */
.ud-ty{position:absolute;left:20px;bottom:0;display:grid}
.ud-ty b{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:22px;color:#0A0B12;white-space:nowrap}
.ud-ty span{font-size:12.5px;line-height:17px;color:var(--ink-3);white-space:nowrap}
/* Volume and weight side by side */
.ud-mts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.ud-mt{min-width:0}
.ud-mt-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.75px;line-height:20px}
.ud-mt-h span{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:#161616;min-width:0}
.ud-mt-h b{font-weight:600;font-variant-numeric:tabular-nums}
.ud-bar{height:6px;margin-top:6px;border-radius:999px;background:#ECECEC;overflow:hidden}
.ud-bar i{display:block;height:100%;min-width:3px;border-radius:inherit;background:#7A7A7A;transform-origin:left}
.ud-mt-f{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 8px;margin-top:6px;font-size:12.75px;line-height:18px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ud-mt-f span{white-space:nowrap}
.ud-mt-f span:first-child{color:var(--ink-2)}
/* Message */
.ud-msg{border:1px solid var(--line);border-radius:10px;background:var(--soft-2);padding:12px 13px 13px}
.ud-msg h3{margin:0 0 3px;font-size:14.5px;font-weight:600;line-height:20px;color:#161616}
.ud-msg p{font-size:13.75px;line-height:20px;color:var(--ink-2)}
.ud-msg p b{font-weight:600;color:#161616}
/* The client's past shipments, under the meters */
.hc{position:relative}
.hc-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:12.5px;line-height:18px;color:var(--ink-3)}
.hc-svg{display:block;width:100%;height:auto;overflow:visible}
.hc-svg text{font-family:var(--f);font-variant-numeric:tabular-nums}
.hc-hit{fill:transparent}
.hc-tip{position:absolute;z-index:30;transform:translate(-50%,calc(-100% - 8px));padding:6px 9px;border-radius:7px;background:var(--tip);color:#FFFFFF;font-size:12px;line-height:17px;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow-pop)}
.hc-tip b{font-weight:600}
.hc-tip span{color:#CFCFCF}
.hp{position:relative;display:inline-block}
.hp-btn{display:inline-flex;align-items:center;gap:1px;height:24px;padding:0 4px 0 8px;border:1px solid #D9D9D9;border-radius:6px;background:var(--canvas);font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.hp-btn:hover{border-color:var(--ink-4)}
.hp-btn svg{flex:none}
.hp-btn.tm{height:32px;gap:8px;padding:0 12px;border:0;border-radius:5px;background:#ECEBEB;font-size:14px;font-weight:500;line-height:16px;letter-spacing:-.042px;color:#202020}
.hp-btn.tm:hover{background:#E2E1E1}
.hp-btn.tm .tm-p{font-weight:400;color:#6C6C6C}
.hp-menu{position:absolute;top:calc(100% + 4px);right:0;z-index:40;width:156px;padding:4px;background:var(--canvas);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow-pop)}
.hp-menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:30px;padding:0 8px;border:0;border-radius:6px;background:none;font-size:13px;color:var(--ink);text-align:left}
.hp-menu button:hover,.hp-menu button:focus-visible{background:var(--soft)}
.hp-menu button[aria-checked="true"]{font-weight:600}
/* Popover, designer's Figma, 6 Nov: no title; the chart first under "Utilisation history", then the figures, then a text button with a chevron (the design system's Button, Type=Text, in ink rather than blue). The Overview note shows the figures only. */
.hcw .hc-t{margin:0;padding:0;font-size:14px;font-weight:600;line-height:24px;color:#0A0B12}
.hcw>p{margin-top:16px}
/* Insights › Analytics › Container Utilisation, from the designer's screenshot (6 Nov, at about 1.1×): tabs 15px medium, 17px apart, a 2px underline under the open tab sitting on a 1px rule.
   Below it, the utilisation history straight on the page (no card, option D of utilisation-page-colours): heading and period menu, the sentence with a legend,
   then the popover's first column chart at page size. Columns: red under 30% (the popover's "significant unused space"), today's blue 30–59%, a very pale
   green from 60%. The green has to be that pale to stay apart from the blue, and the red is a step deeper so red–green colour-blind viewers can tell it from the green. */
/* Restyled from the designer's Figma (232:32010, 16 Nov): an "Analytics" title over the tabs, 14px tabs with 16px sides, 24px page padding, square columns in
   red/400 #F46E63 under 30%, blue/500 #1F8FF3 30–59% and green/300 #87E0AD from 60%, and a Volume / Weight switch beside the period menu. A column's colour comes from the higher of its volume and weight (hBand), the same in both views. */
.in-sec{--in-r:#F46E63;--in-rh:#E0574C;--in-u:#1F8FF3;--in-uh:#1878D0;--in-o:#87E0AD;--in-oh:#62CF90;--in-pv:#7681FC;--in-pvh:#5E6AF0;--in-pw:#F9B474;--in-pwh:#F29D55;--in-wl:#F69546}
.in-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;min-height:32px;margin-top:28px}
.in-h h2{font-size:16px;font-weight:600;line-height:16px;letter-spacing:-.048px;color:#111111}
.in-ctl{display:flex;align-items:center;gap:8px}
.in-seg{display:inline-flex}
.in-seg button{height:32px;padding:0 12px;border:1px solid #B1B1B1;background:#FFFFFF;box-shadow:0 1px 1px rgba(0,0,0,.08);font-size:14px;font-weight:500;line-height:16px;letter-spacing:-.042px;color:#6C6C6C;white-space:nowrap}
.in-seg button:first-child{border-radius:5px 0 0 5px}
.in-seg button:last-child{border-radius:0 5px 5px 0}
.in-seg button:hover{color:#202020}
.in-seg button[aria-pressed="true"]{background:#EBEDFF;border-color:#334BFA;color:#293CC8}
.in-seg button:focus-visible{position:relative;outline:2px solid #334BFA;outline-offset:1px}
.in-lg{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0;padding:0;list-style:none;font-size:12px;line-height:16px;color:#6C6C6C}
.in-lg li{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.in-lg i{width:10px;height:10px;border-radius:3px}
.in-lg .r{background:var(--in-r)}
.in-lg .u{background:var(--in-u)}
.in-lg .o{background:var(--in-o)}
.in-pg{padding:24px calc(24px - var(--sbw)) 48px 24px}
.in-t{margin:0 0 24px;font-family:var(--ft);font-size:24px;font-weight:600;line-height:32px;letter-spacing:-.12px;color:#111111}
.in-tabs{display:flex;border-bottom:1px solid #D5D5D5;overflow-x:auto;scrollbar-width:none}
.in-tab{flex:none;height:40px;margin-bottom:-1px;padding:8px 16px 0;border:0;border-bottom:2px solid transparent;background:none;font-size:14px;font-weight:500;line-height:16px;letter-spacing:-.042px;color:#6C6C6C;white-space:nowrap}
.in-tab[aria-selected="true"]{color:#202020;border-bottom-color:#202020}
.in-tab:hover{color:#202020}
.in-empty{margin-top:16px;font-size:14px;line-height:20px;color:var(--ink-3)}
.in-svg{display:block;overflow:visible}
.in-svg *{pointer-events:none}
.in-svg .hc-hit{pointer-events:all}
.in-svg text{font-family:var(--f);font-variant-numeric:tabular-nums}
.in-ax{font-size:10px;fill:#909090}
.in-mo{font-size:12px;fill:#6C6C6C}
/* over 12 months (All time, v91) the year goes on a line of its own under the first month and each January */
.in-yr{font-size:10.5px;fill:#9A9A9A}
.in-avg{font-size:12px;font-weight:600;fill:#464646}
.ic-b{transition:fill .12s}
.ic-b.r{fill:var(--in-r)}
.ic-b.u{fill:var(--in-u)}
.ic-b.o{fill:var(--in-o)}
.ic:hover .ic-b.r{fill:var(--in-rh)}

    const tick=now=>{ if(root._dtok!==tok||!root.isConnected) return; const x=Math.max(0,Math.min(1,(now-t0)/D)), e=x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2; set(Math.round(e*N)); if(x<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    setTimeout(()=>{ if(root._dtok===tok) set(N); },dur+D+400);
  }
}
function drawUD(play,enter){
  $$('.ud-pop').forEach(e=>e.remove());
  const s=S.route==='project'?null:shipBy(S.route), trg=$('.ut-u');
  if(!s||!D.open) D.open=false;
  if(trg) trg.setAttribute('aria-expanded',String(D.open));
  if(!D.open) return;
  $('.ov').insertAdjacentHTML('beforeend',udPop(s));
  const root=$('#ud');
  if(enter) root.focus({preventScroll:true});
  if(play) playUD(root);
}
function udOpen(){
  D.open=true; drawUD(true,true);
}
function udClose(){
  if(!D.open) return;
  D.open=false; drawUD();
  const trg=$('.ut-u'); if(trg) trg.focus({preventScroll:true});
}

/* ---------- carbon emissions (option B of carbon-options.html, 11 Nov) ----------
   An estimate for the ocean leg, port to port: containers in TEU (20' = 1, 40' = 2) × sea distance × a lane factor. That's the ISO 14083 / GLEC way
   for full containers, so an emptier container doesn't lower it. Sample factor and approximate distances; the real figure would come from a calculator. */
const CO_FACTOR=64; /* g CO2e per TEU-km, container ships Asia – North America, well-to-wake (sample) */
const CO_KM={s1:27700,s2:12800,s3:10650}; /* sea distance along each shipment's ports, approximate */
const TEUS={'20GP':1,'40GP':2,'40HQ':2};
const coOf=s=>{ const km=CO_KM[s.k]; if(!km||!TEUS[s.type]) return null; const teu=TEUS[s.type]*s.n; return {km,teu,kg:Math.round(teu*km*CO_FACTOR/10000)*10}; };
/* kg up to 9,999, then tonnes with one decimal; rounded to 10 kg so it doesn't look more exact than it is */
const coFmt=kg=>kg<10000?[num(kg),'kg CO₂e']:[(kg/1000).toFixed(1),'t CO₂e'];
const LEAF='<svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.86 13.14C4.23 8.01 7.74 4.05 14.4 3.78C14.58 10.35 10.44 13.95 4.86 13.14Z"/><path d="M3.15 14.85L10.08 7.92"/></svg>'; /* Figma 251:42190 */
function coBtnHTML(s){
  const c=coOf(s);
  if(!c) return `<span class="co-u" tabindex="0" aria-describedby="co-tip">${LEAF}<span class="none">—</span><span class="u lg">kg CO₂e</span><span class="ut-tip" role="tooltip" id="co-tip">Estimated carbon emissions</span></span>`;
  const [v,u]=coFmt(c.kg);
  return `<span class="co-u" tabindex="0" aria-describedby="co-tip">${LEAF}<span class="lg">${v} <span class="u">${u}</span></span><span class="sh">${(c.kg/1000).toFixed(1)} <span class="u">t</span></span><span class="ut-tip" role="tooltip" id="co-tip">Estimated carbon emissions</span></span>`;
}

/* ---------- Insights › Analytics › Container Utilisation ---------- */
/* Opened by "View utilisation history" in the popover, or by Analytics in the side nav. Only the Container Utilisation tab is built; the others are stubs.
   The chart is the popover's first column chart (option A of utilisation-history-options) at page width: one column per shipment, oldest to newest,
   months underneath, a 0–100% axis, and a dashed average. Each column takes its band's colour (IN_BANDS). The page looks the same however it's opened
   (designer, 16 Nov): a shipment's popover no longer adds that shipment at the end. The page has its own period menu (S.hPer, Past 6 Months to start); the popover always shows 6 months (v83).
   The Prototype bar also offers 'Line graph' (S.hView 'vw', insVwSvg), volume and weight as two monthly lines,
   and 'Side by side' (S.hView 'pair', insPairSvg), volume and weight as a pair of bars per shipment with no switch or bands. */
const IN_TABS=['CRD','Milestone','Shipments','Transit Time','Inspections','Carbon Emission','Rates','Container Utilisation'];
const IN_BANDS=[{below:30,k:'r',t:'Under 30%'},{below:60,k:'u',t:'30–59%'},{below:Infinity,k:'o',t:'60% and up'}];
const inBand=v=>IN_BANDS.find(b=>v<b.below).k;
/* A shipment's colour (designer, 16 Nov; option A of analytics-colour-rule-options): the band of whichever is higher, volume or weight, since a container
   is full when it runs out of space or reaches its weight limit. Red only when both are under 30%; green when either is 60% or more. It's the same test the
   popover and the Overview note use, and the colour doesn't change with the Volume / Weight switch. */
const hBand=x=>inBand(Math.max(x[4],x[5]));
const IN_LG=IN_BANDS.map(b=>`<li><i class="${b.k}"></i>${b.t}</li>`).join('');
function renderInsights(){
  const last=IN_TABS.length-1;
  $('#v-insights').innerHTML=`<h1 class="in-t">Analytics</h1><div class="in-tabs" role="tablist" aria-label="Analytics">${IN_TABS.map((t,i)=>`<button type="button" class="in-tab" role="tab" aria-selected="${i===last}"${i===last?'':` data-stub="${t}"`}>${t}</button>`).join('')}</div>
    <div class="in-sec" role="tabpanel" aria-label="Container Utilisation">${insCardHTML()}</div>`;
  const tl=$('.in-tabs'); tl.scrollLeft=tl.scrollWidth; /* on narrow screens the open tab, the last one, starts in view */
  drawInsChart();
}
/* Volume / Weight (designer, 16 Nov, option B of analytics-weight-options, styled from Figma 232:32010): the chart shows one at a time. Both views
   colour each column by its shipment (hBand), so they share the legend.
   Every view has the same title row and period menu, and its legend centred under the chart (designer, 16 Nov). The tooltips give both figures. */
const hVal=x=>S.hMeas==='w'?x[5]:x[4];
const IN_MEAS=[['v','Volume'],['w','Weight']];
function insCardHTML(){
  const list=hShips(null), ship=S.hView==='ship';
  const ctl=ship?`<div class="in-ctl"><span class="in-seg" role="group" aria-label="Show">${IN_MEAS.map(([k,l])=>`<button type="button" data-hmeas="${k}" aria-pressed="${S.hMeas===k}">${l}</button>`).join('')}</span>${hPicker('pg')}</div>`:hPicker('pg');
  if(!list.length) return `<div class="in-h"><h2>Utilisation history</h2>${hPicker('pg')}</div><p class="in-empty">No container shipments ${S.hPer==='all'?'':`in the last ${S.hPer} months `}yet.</p>`;
  /* By shipment adds the Volume / Weight switch; Side by side and Line graph show volume and weight together */
  const lg=ship?IN_LG:S.hView==='vw'?VW_LG():'<li><i class="pv"></i>Volume</li><li><i class="pw"></i>Weight</li>';
  return `<div class="in-h ch"><h2>Utilisation history</h2>${ctl}</div>
    <div class="hc" id="in-chart"></div>
    <ul class="in-lg in-lg-c" aria-label="Legend">${lg}</ul>`;
}
/* The chart fills the page's height: t is the room from the chart's top to the end of the scroll area, less the page's bottom padding.
   Each view fits its plot into it, between today's 210px and 640px (150px on phones), so a short window keeps today's size and scrolls. */
const insFit=h=>{ const b=$('#body'), y0=h.getBoundingClientRect().top-b.getBoundingClientRect().top+b.scrollTop, pad=parseFloat(getComputedStyle($('#v-insights')).paddingBottom)||0; return Math.floor(b.clientHeight-y0-pad); };
const insPlotH=(W,t,below)=>W<560?150:Math.max(210,Math.min(640,t-22-below));
function drawInsChart(){ const h=$('#in-chart'); if(!h) return; h.innerHTML=''; /* the old drawing goes first: wider than a shrunk window, it adds a scrollbar that would cut the height */
  const w=Math.max(280,Math.floor(h.clientWidth)), t=insFit(h); h.dataset.w=w; h.dataset.t=t; h.innerHTML=insSvg(w,t); }
function insSvg(W,T){
  if(S.hView==='pair') return insPairSvg(W,T);
  if(S.hView==='vw') return insVwSvg(W,T);
  const wt=S.hMeas==='w', list=hShips(null), n=list.length, nm=perMonths(), yrs=nm>12, avg=Math.round(list.reduce((a,x)=>a+hVal(x),0)/n), f1=v=>v.toFixed(1);
  const gl=38, gr=64, top=22, H=insPlotH(W,T,28+(yrs?14:0)+30), base=top+H, plotW=W-gl-gr, y=v=>top+H*(1-v/100);
  /* xs: each shipment's centre: one equal slot each, the bar 66% of it, up to 22px */
  const slot=plotW/n, bw=Math.max(2,Math.min(22,slot*.66)), xs=list.map((x,i)=>gl+slot*(i+.5)), aEnd=gl+plotW;
  /* hover areas run from the midpoint with one neighbour to the midpoint with the next */
  const hx=i=>i?(xs[i-1]+xs[i])/2:gl, hx1=i=>i<n-1?(xs[i]+xs[i+1])/2:aEnd;
  const bar=(x,v,cls)=>`<rect class="${cls}" x="${f1(x-bw/2)}" y="${f1(y(v))}" width="${f1(bw)}" height="${f1(base-y(v))}"/>`; /* square ends, as in the designer's Figma */
  const hit=(x0,x1,tx,ty,tip)=>`<rect class="hc-hit" x="${f1(x0)}" y="${top}" width="${f1(x1-x0)}" height="${H}" data-tx="${f1(tx)}" data-ty="${f1(ty)}" data-tip="${tip.replace(/"/g,'&quot;')}"/>`;
  let grid='', cols='', labels='';
  [0,25,50,75,100].forEach(v=>{ grid+=`<path d="M${gl} ${f1(y(v))}H${f1(W-gr)}" stroke="${v?'#EFEFEF':'#D9D9D9'}"/><text x="${gl-8}" y="${f1(y(v)+3.5)}" text-anchor="end" class="in-ax">${v}%</text>`; });
  /* the tooltip gives both figures, which shows why a short column can be green (a heavy load); no separate line for it (designer, 16 Nov) */
  list.forEach((x,i)=>{ const v=hVal(x);
    cols+=`<g class="ic">${bar(xs[i],v,'ic-b '+hBand(x))}${hit(hx(i),hx1(i),xs[i],y(v),`<b>${x[0]}</b> · ${x[4]}% volume · ${x[5]}% weight<br><span>${x[1]} ${HMONTHS[x[2]][0]} ${HMONTHS[x[2]][1]} · ${SZL[x[3]]}</span>`)}</g>`; });
  /* month names under each month's columns, with ticks between; the year on the first month and January where it fits, or single letters when months get narrow */
  const groups=[]; for(let m=NOW-nm;m<NOW;m++){ const idx=list.map((x,i)=>x[2]===m?i:-1).filter(i=>i>=0); if(idx.length) groups.push([m,hx(idx[0]),hx1(idx[idx.length-1])]); }
  const short=Math.min(...groups.map(g=>g[2]-g[1]))<30;
  groups.forEach(([m,x0,x1],k)=>{ const mo=HMONTHS[m][0], t=short?mo[0]:!yrs&&(k===0||mo==='Jan')&&x1-x0>=62?`${mo} ${HMONTHS[m][1]}`:mo;
    labels+=`<text x="${f1((x0+x1)/2)}" y="${base+19}" text-anchor="middle" class="in-mo">${t}</text>${k?`<path d="M${f1(x0)} ${base}v5" stroke="#C9C9C9"/>`:''}`;
    if(yrs&&(k===0||mo==='Jan')) labels+=`<text x="${f1((x0+x1)/2)}" y="${base+33}" text-anchor="middle" class="in-yr">${HMONTHS[m][1]}</text>`; });
  const ya=f1(y(avg));
  return `<svg class="in-svg" viewBox="0 0 ${W} ${base+28+(yrs?14:0)}" width="${W}" height="${base+28+(yrs?14:0)}" role="img" aria-label="${wt?'Weight':'Space'} used by each of ${n} shipments in the last ${nm} months, oldest to newest, average ${avg}%.">
    ${grid}${cols}<path d="M${gl} ${ya}H${f1(aEnd)}" stroke="#404040" stroke-width="1.2" stroke-dasharray="3 3"/><text x="${f1(W-gr+10)}" y="${f1(+ya+4)}" class="in-avg">Avg ${avg}%</text>${labels}</svg>`;
}

/* Line graph (designer, 16 Nov), in place of Monthly line: the v67 "Volume and weight by month" chart (option A of analytics-combined-chart-options).
   The average volume and the average weight of each month's shipments as two lines on 0–100%, each labelled at its end with the latest month's figure,
   and the shipment count under each month. Laid out like Side by side: no switch, the small period menu, the legend centred under the chart (so the plot
   leaves 30px for it). Volume is Side by side's Marine/500; weight is Orange/400, a step darker than its bars so a 2px line holds up on white.
   Each month is one hover group; a month with no shipments has no points and the lines run past it. */
const VW_LG=()=>`<li>${VW_MK('var(--in-pv)')}Volume</li><li>${VW_MK('var(--in-wl)',true)}Weight</li>`;
const VW_MK=(c,hollow)=>`<svg width="22" height="10" viewBox="0 0 22 10" aria-hidden="true"><path d="M1 5h20" stroke="${c}" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="5" r="3.5" fill="${hollow?'#FFFFFF':c}" stroke="${hollow?c:'#FFFFFF'}" stroke-width="${hollow?2:1.5}"/></svg>`;
function insVwSvg(W,T){
  const list=hShips(null), nm=perMonths(), yrs=nm>12, f1=v=>v.toFixed(1), narrow=W<560, gl=38, gr=narrow?24:112, top=22, plotW=W-gl-gr, slot=plotW/nm, counts=!narrow&&slot>=74;
  const yb=(counts?44:28), H=insPlotH(W,T,yb+(yrs?14:0)+30), base=top+H, y=v=>top+H*(1-v/100);
  const ms=[]; for(let m=NOW-nm;m<NOW;m++){ const r=list.filter(x=>x[2]===m), c=r.length; ms.push({m,c,v:c?Math.round(r.reduce((a,x)=>a+x[4],0)/c):null,w:c?Math.round(r.reduce((a,x)=>a+x[5],0)/c):null}); }
  const cx=i=>gl+slot*(i+.5), ok=ms.map((mo,i)=>[mo,i]).filter(([mo])=>mo.c), tall=base+yb+(yrs?14:0);
  const path=k=>ok.map(([mo,i],j)=>`${j?'L':'M'}${f1(cx(i))} ${f1(y(mo[k]))}`).join('');
  let grid='', groups='', labels='', dots='', ends='';
  [0,25,50,75,100].forEach(v=>{ grid+=`<path d="M${gl} ${f1(y(v))}H${f1(W-gr)}" stroke="${v?'#EFEFEF':'#D9D9D9'}"/><text x="${gl-8}" y="${f1(y(v)+3.5)}" text-anchor="end" class="in-ax">${v}%</text>`; });
  ms.forEach((mo,i)=>{
    const [mn,yr]=HMONTHS[mo.m], t=slot<34?mn[0]:!yrs&&(i===0||mn==='Jan')&&slot>=62?`${mn} ${yr}`:mn, cnt=`${mo.c} shipment${mo.c===1?'':'s'}`;
    labels+=`<text x="${f1(cx(i))}" y="${base+19}" text-anchor="middle" class="in-mo">${t}</text>${i?`<path d="M${f1(gl+slot*i)} ${base}v5" stroke="#C9C9C9"/>`:''}`;
    if(counts) labels+=`<text x="${f1(cx(i))}" y="${base+35}" text-anchor="middle" class="in-n">${cnt}</text>`;
    if(yrs&&(i===0||mn==='Jan')) labels+=`<text x="${f1(cx(i))}" y="${base+yb+5}" text-anchor="middle" class="in-yr">${yr}</text>`;
    const tip=mo.c?`<b>${mn} ${yr}</b> · ${cnt}<br><span>Volume ${mo.v}% · Weight ${mo.w}% on average</span>`:`<b>${mn} ${yr}</b><br><span>No shipments</span>`;
    groups+=`<g class="ic"><rect class="hl" x="${f1(gl+slot*i)}" y="${top}" width="${f1(slot)}" height="${H}"/><rect class="hc-hit" x="${f1(gl+slot*i)}" y="${top}" width="${f1(slot)}" height="${H}" data-tx="${f1(cx(i))}" data-ty="${f1(mo.c?y(Math.max(mo.v,mo.w))-7:base)}" data-tip="${tip.replace(/"/g,'&quot;')}"/></g>`;
  });
  ok.forEach(([mo,i])=>{ dots+=`<circle cx="${f1(cx(i))}" cy="${f1(y(mo.v))}" r="4" fill="var(--in-pv)" stroke="#FFFFFF" stroke-width="2"/><circle cx="${f1(cx(i))}" cy="${f1(y(mo.w))}" r="3.5" fill="#FFFFFF" stroke="var(--in-wl)" stroke-width="2"/>`; });
  /* end labels, kept at least 16px apart so close figures don't overlap */
  const last=ok[ok.length-1];
  if(last&&!narrow){ const [mo,i]=last, xl=f1(cx(i)+12); let a=y(mo.v), b=y(mo.w); if(Math.abs(a-b)<16){ const mid=(a+b)/2, s=a<=b?-1:1; a=mid+s*8; b=mid-s*8; }
    ends=`<text x="${xl}" y="${f1(a+4)}" class="in-end">Volume <tspan>${mo.v}%</tspan></text><text x="${xl}" y="${f1(b+4)}" class="in-end">Weight <tspan>${mo.w}%</tspan></text>`; }
  return `<svg class="in-svg" viewBox="0 0 ${W} ${tall}" width="${W}" height="${tall}" role="img" aria-label="Average volume and weight used each month over the last ${nm} months: ${ok.map(([mo])=>`${HMONTHS[mo.m][0]} volume ${mo.v}%, weight ${mo.w}%`).join('; ')}.">
    ${grid}${groups}<path d="${path('v')}" fill="none" stroke="var(--in-pv)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="${path('w')}" fill="none" stroke="var(--in-wl)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${ends}${labels}</svg>`;
}


/* Side by side (designer, 16 Nov; Figma 249:41181): each shipment, oldest to newest, as two square bars next to each other, volume then weight, with
   no colour bands. One slot per shipment as in By shipment; the pair takes up to 72% of it, at most 48px, the bars 1px+ apart (the Figma's 22px bars
   and 4px gap at full size). One dashed average (designer, 16 Nov): the mean of each shipment's higher figure, volume or weight, the same test as the
   popover's. The legend is HTML under the chart, so the plot leaves room for it. Hover a pair for the shipment's tooltip. */
function insPairSvg(W,T){
  const list=hShips(null), n=list.length, nm=perMonths(), yrs=nm>12, f1=v=>v.toFixed(1), gl=38, gr=64, top=22, H=insPlotH(W,T,28+(yrs?14:0)+30), base=top+H, plotW=W-gl-gr, y=v=>top+H*(1-v/100);
  const slot=plotW/n, pair=Math.min(48,slot*.72), bw=pair/2.19, gap=Math.max(1,pair-2*bw), xs=list.map((x,i)=>gl+slot*(i+.5));
  const hx=i=>i?(xs[i-1]+xs[i])/2:gl, hx1=i=>i<n-1?(xs[i]+xs[i+1])/2:gl+plotW;
  const bar=(x0,v,cls)=>`<rect class="ic-b ${cls}" x="${f1(x0)}" y="${f1(y(v))}" width="${f1(bw)}" height="${f1(base-y(v))}"/>`;
  const avg=Math.round(list.reduce((a,x)=>a+Math.max(x[4],x[5]),0)/n);
  let grid='', cols='', labels='';
  [0,25,50,75,100].forEach(v=>{ grid+=`<path d="M${gl} ${f1(y(v))}H${f1(W-gr)}" stroke="${v?'#EFEFEF':'#D9D9D9'}"/><text x="${gl-8}" y="${f1(y(v)+3.5)}" text-anchor="end" class="in-ax">${v}%</text>`; });
  list.forEach((x,i)=>{ const tip=`<b>${x[0]}</b> · ${x[4]}% volume · ${x[5]}% weight<br><span>${x[1]} ${HMONTHS[x[2]][0]} ${HMONTHS[x[2]][1]} · ${SZL[x[3]]}</span>`;
    cols+=`<g class="ic">${bar(xs[i]-gap/2-bw,x[4],'pv')}${bar(xs[i]+gap/2,x[5],'pw')}<rect class="hc-hit" x="${f1(hx(i))}" y="${top}" width="${f1(hx1(i)-hx(i))}" height="${H}" data-tx="${f1(xs[i])}" data-ty="${f1(y(Math.max(x[4],x[5])))}" data-tip="${tip.replace(/"/g,'&quot;')}"/></g>`; });
  const groups=[]; for(let m=NOW-nm;m<NOW;m++){ const idx=list.map((x,i)=>x[2]===m?i:-1).filter(i=>i>=0); if(idx.length) groups.push([m,hx(idx[0]),hx1(idx[idx.length-1])]); }
  const short=Math.min(...groups.map(g=>g[2]-g[1]))<30;
  groups.forEach(([m,x0,x1],k)=>{ const mo=HMONTHS[m][0], t=short?mo[0]:!yrs&&(k===0||mo==='Jan')&&x1-x0>=62?`${mo} ${HMONTHS[m][1]}`:mo;
    labels+=`<text x="${f1((x0+x1)/2)}" y="${base+19}" text-anchor="middle" class="in-mo">${t}</text>${k?`<path d="M${f1(x0)} ${base}v5" stroke="#C9C9C9"/>`:''}`;
    if(yrs&&(k===0||mo==='Jan')) labels+=`<text x="${f1((x0+x1)/2)}" y="${base+33}" text-anchor="middle" class="in-yr">${HMONTHS[m][1]}</text>`; });
  const ya=f1(y(avg));
  return `<svg class="in-svg" viewBox="0 0 ${W} ${base+28+(yrs?14:0)}" width="${W}" height="${base+28+(yrs?14:0)}" role="img" aria-label="Volume and weight used by each of ${n} shipments in the last ${nm} months, oldest to newest, side by side. On average the higher of the two is ${avg}%.">
    ${grid}${cols}<path d="M${gl} ${ya}H${f1(W-gr)}" stroke="#404040" stroke-width="1.2" stroke-dasharray="3 3"/><text x="${f1(W-gr+10)}" y="${f1(+ya+4)}" class="in-avg">Avg ${avg}%</text>${labels}</svg>`;
}

/* ---------- router ---------- */
const ROUTES=['projects','project','s1','s2','s3','insights'];
function go(r){

function boot(){

  $('#astra-btn').innerHTML=`${I.sparkle}Ask Astra`; $('#astra-hist').innerHTML=I.history;
  $('#new-rfq').innerHTML=`New RFQ${I.plus20}`;
  $('#i-bell').innerHTML=I.bell; $('#i-apps').innerHTML=I.apps; $('#i-chat').innerHTML=I.chat; $('#jump-set').innerHTML=I.adjust;
  /* side nav: collapse to icons on desktop; a drawer from the menu button under 900px (both as in the Pods prototype) */
  const app=$('#app'), tg=$('#side-tg');
  tg.addEventListener('click',()=>{ const c=app.classList.toggle('collapsed'); tg.setAttribute('aria-label',c?'Expand sidebar':'Collapse sidebar'); window.dispatchEvent(new Event('resize')); });

document.addEventListener('click',e=>{
  const t=e.target;

  const hs=t.closest('[data-hp-set]'); if(hs){ S.hPer=hs.dataset.n==='all'?'all':+hs.dataset.n; S.hMenu=null; redrawHist(); const b=$(`[data-hp="${hs.dataset.hpSet}"]`); if(b) b.focus(); return; }
  const hb=t.closest('[data-hp]'); if(hb){ S.hMenu=S.hMenu===hb.dataset.hp?null:hb.dataset.hp; redrawHist(); const f=$('.hp-menu [aria-checked="true"]')||$(`[data-hp="${hb.dataset.hp}"]`); if(f) f.focus(); return; }
  if(S.hMenu&&!t.closest('.hp-menu')){ S.hMenu=null; $$('.hp-menu').forEach(m=>{ m.hidden=true; }); $$('[data-hp]').forEach(b=>b.setAttribute('aria-expanded','false')); }
    const hi=t.closest('[data-hist]'); if(hi){ S.hist=hi.dataset.hist; $$('[data-hist]').forEach(b=>b.setAttribute('aria-pressed',String(b===hi))); if(shipBy(S.route)){ renderShipment(S.route); drawUD(); } return; }
    if(!t.closest('#pop')&&!t.closest('#sh-dd')) closePop();

    if(t.closest('[data-ud]')){ if(D.open) udClose(); else udOpen(); return; }

    const it=t.closest('.pop-i'); if(it){ closePop(); go(it.dataset.go); return; }
    if(t.closest('#sh-dd')){ const b=t.closest('#sh-dd'); openPop(b,SHIPMENTS.map(s=>`<button type="button" class="pop-i" role="menuitem" data-go="${s.k}" aria-current="${s.k===S.route}">${PROJECT.id+s.sfx}<small>${s.stops[0].code} → ${s.stops[s.stops.length-1].code}</small></button>`).join('')); return; }
    if(t.closest('[data-close-nt]')){ S.ntHidden[S.route]=true; renderShipment(S.route); toast(`Hidden for ${shipBy(S.route).sfx}. The FCL button still opens the details.`); return; }
    const pl=t.closest('[data-pill]'); if(pl){ S.cmtPill=pl.dataset.pill; renderShipment(S.route); const nb=$(`[data-pill="${S.cmtPill}"]`); if(nb) nb.focus(); return; }
    const cp=t.closest('[data-copy]'); if(cp){ const v=cp.dataset.copy; (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Email address copied'),()=>toast(v)); return; }
    const hm=t.closest('[data-hmeas]'); if(hm){ S.hMeas=hm.dataset.hmeas; redrawHist(); const f=$(`[data-hmeas="${S.hMeas}"]`); if(f) f.focus(); return; }
    const hv=t.closest('[data-hview]'); if(hv){ S.hView=hv.dataset.hview; $$('[data-hview]').forEach(b=>b.setAttribute('aria-pressed',String(b===hv))); redrawHist(); return; }
    const st=t.closest('[data-stub]'); if(st){ toast(`${st.dataset.stub} isn't part of this prototype`); return; }
    const r=t.closest('[data-r]'); if(r){ go(r.dataset.r); return; }
  });
  document.addEventListener('keydown',e=>{
if(e.key==='Escape'&&S.hMenu){ const id=S.hMenu; S.hMenu=null; redrawHist(); const b=$(`[data-hp="${id}"]`); if(b) b.focus(); return; }
if((e.key==='ArrowDown'||e.key==='ArrowUp')&&e.target.closest('.hp-menu')){ e.preventDefault(); const items=$$('button',e.target.closest('.hp-menu')), i=items.indexOf(e.target); items[(i+(e.key==='ArrowDown'?1:items.length-1))%items.length].focus(); return; }
if(e.key==='Escape'){ closePop(); udClose(); }
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('.shp,.pc')){ e.preventDefault(); go(e.target.dataset.r); }
    if(e.key==='Enter'&&e.target.id==='cmt-input'&&e.target.value.trim()){ toast('Comments post in the main app'); e.target.value=''; }
  });
document.addEventListener('mouseover',e=>{ const h=e.target.closest('.hc-hit'); if(h) showTip(h); else if(!e.target.closest('.hc')) hideTip(); });
document.addEventListener('mouseout',e=>{ if(e.target.closest('.hc-hit')&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.hc-hit'))) hideTip(); });
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
let inRz=0; window.addEventListener('resize',()=>{ if(S.route!=='insights') return; cancelAnimationFrame(inRz); inRz=requestAnimationFrame(()=>{ const h=$('#in-chart'); if(h&&(Math.max(280,Math.floor(h.clientWidth))!==+h.dataset.w||insFit(h)!==+h.dataset.t)){ hideTip(); drawInsChart(); } }); });
  go(location.hash.slice(1));
}
document.addEventListener('DOMContentLoaded',boot);
})();
</script>
